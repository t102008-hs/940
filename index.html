<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>輔導系統</title>
  
  <!-- PWA 與加入主畫面設定 (iOS 專用) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="輔導系統">
  <meta name="theme-color" content="#f5ebe0">
  
  <!-- 1. 替換為你的 GitHub Raw 圖片網址 -->
  <link rel="apple-touch-icon" href="https://docs.google.com/drawings/d/e/2PACX-1vR2JZohETPGiTtQdFUBetcrL9Qo9odb1HXwIhZO1oTj-fQmaM8cuct_vpSb69cPUE1hJCfmIPiIx6mK/pub?w=960&h=720">
  <link rel="icon" href="https://docs.google.com/drawings/d/e/2PACX-1vR2JZohETPGiTtQdFUBetcrL9Qo9odb1HXwIhZO1oTj-fQmaM8cuct_vpSb69cPUE1hJCfmIPiIx6mK/pub?w=960&h=720">
  
  <style>
    body, html {
      margin: 0; padding: 0; height: 100%; width: 100%; 
      background-color: #f5ebe0; /* 你的米黃色主題底色 */
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: 'Helvetica Neue', 'Noto Sans TC', Arial, sans-serif;
    }
    
    /* 啟動畫面卡片設計 */
    .splash-container {
      text-align: center; width: 85%; max-width: 360px;
      background: rgba(255, 255, 255, 0.75);
      padding: 40px 20px; border-radius: 28px;
      box-shadow: 0 10px 30px rgba(176,137,104,0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    
    .splash-container img {
      width: 100px; height: 100px; border-radius: 22px;
      margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      object-fit: cover;
    }
    
    .splash-container h1 { 
      color: #755438; font-size: 24px; margin-bottom: 10px; font-weight: 800; letter-spacing: 1px;
    }
    
    .splash-container p { 
      color: #936e4d; font-size: 14px; margin-bottom: 35px; line-height: 1.6; font-weight: 500;
    }
    
    .btn-enter {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      background-color: #b08968; color: white; padding: 16px 32px;
      border-radius: 999px; text-decoration: none; font-weight: bold; font-size: 16px;
      box-shadow: 0 6px 20px rgba(176,137,104,0.4); transition: transform 0.2s, background-color 0.2s;
      width: 80%;
    }
    
    .btn-enter:active { 
      transform: scale(0.95); background-color: #936e4d; box-shadow: 0 2px 10px rgba(176,137,104,0.3);
    }
  </style>
</head>
<body>

  <div class="splash-container">
    <!-- 2. 這裡放你的 GitHub Raw Logo 圖片網址 -->
    <img src="https://docs.google.com/drawings/d/e/2PACX-1vR2JZohETPGiTtQdFUBetcrL9Qo9odb1HXwIhZO1oTj-fQmaM8cuct_vpSb69cPUE1hJCfmIPiIx6mK/pub?w=960&h=720" alt="App Logo">
    
    <h1>輔導系統</h1>
    <p>整合式輔導紀錄與魔法空間預約<br><span style="font-size: 12px; opacity: 0.7;">請點擊下方按鈕安全啟動系統</span></p>
    
    <!-- 3. 替換為你的 GAS 執行網址 (結尾為 /exec) -->
    <a href="https://script.google.com/a/macros/tmail.hc.edu.tw/s/AKfycbw-F3mVG8vOuZyC9s2WX-yUyYarFUwNr-kXCvjBSD6gOyUqdSETBfev_brTrfU7Xiijug/exec" class="btn-enter" target="_self">
      🚀 進入系統
    </a>
  </div>

</body>
</html>
