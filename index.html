<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>輔導系統</title>
  
  <!-- 1. PWA 與加入主畫面設定寫在最外層，iOS 才看得到 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="輔導系統">
  
  <!-- 2. 在這裡填入你剛剛取得的 GitHub Raw 圖片網址 -->
  <link rel="apple-touch-icon" href="https://docs.google.com/drawings/d/e/2PACX-1vR2JZohETPGiTtQdFUBetcrL9Qo9odb1HXwIhZO1oTj-fQmaM8cuct_vpSb69cPUE1hJCfmIPiIx6mK/pub?w=960&h=720">
  <link rel="icon" href="https://docs.google.com/drawings/d/e/2PACX-1vR2JZohETPGiTtQdFUBetcrL9Qo9odb1HXwIhZO1oTj-fQmaM8cuct_vpSb69cPUE1hJCfmIPiIx6mK/pub?w=960&h=720">
  
  <style>
    /* 讓內嵌的畫面完全填滿手機螢幕，不留白邊 */
    body, html {
      margin: 0; 
      padding: 0; 
      height: 100%; 
      overflow: hidden; 
      background-color: #f5ebe0; /* 你的奶茶主題底色 */
    }
    iframe {
      border: none; 
      width: 100%; 
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- 3. 把你的 Google Apps Script 執行網址 (結尾是 /exec) 貼在這裡 -->
  <iframe src="https://script.google.com/a/macros/tmail.hc.edu.tw/s/AKfycbw-F3mVG8vOuZyC9s2WX-yUyYarFUwNr-kXCvjBSD6gOyUqdSETBfev_brTrfU7Xiijug/exec"></iframe>

</body>
</html>
