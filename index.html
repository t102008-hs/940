<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>輔導與預約整合系統 - 跳轉中</title>
  
  <!-- 第一重防護：Meta 自動跳轉 (設定 0 秒) -->
  <meta http-equiv="refresh" content="0; url=https://script.google.com/a/macros/tmail.hc.edu.tw/s/AKfycbzCf8RBc0dtbK68LLia2X5qwYN_LrdcrQ8ermtaGRW-3-Xd2BxyEk8az1TYCzJ08qI9/exec">
  
  <!-- 第二重防護：JavaScript 強制替換網址 -->
  <script>
    // 使用 replace 可以避免破壞瀏覽器的「上一頁」歷史紀錄
    window.location.replace("https://script.google.com/a/macros/tmail.hc.edu.tw/s/AKfycbzCf8RBc0dtbK68LLia2X5qwYN_LrdcrQ8ermtaGRW-3-Xd2BxyEk8az1TYCzJ08qI9/exec");
  </script>

  <style>
    body { background-color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Noto Sans TC', sans-serif; color: #64748b; }
    .loader { text-align: center; }
    .spinner { margin: 0 auto 1rem auto; width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <h2 style="color: #334155; margin-bottom: 0.5rem;">系統啟動中</h2>
    <p>正在為您導向專屬安全環境...</p>
  </div>
</body>
</html>
